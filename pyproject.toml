[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-observability-platform"
version = "0.1.0"
description = "Detects anomalies in server metrics and explains each one in plain language with an LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",   # no earlier version supports Python 3.13
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]